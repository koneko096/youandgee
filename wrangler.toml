name = "youandgee"
compatibility_date = "2026-08-11"
pages_build_output_dir = "build"

# D1 Database binding - create with: wrangler d1 create youandgee-db
[[d1_databases]]
binding = "DB"
database_name = "youandgee-db"
database_id = "991f1e70-3431-41f7-90e3-ffed4b066ecd"

# Environment variables
[vars]
NODE_ENV = "production"

# Optional: Custom domain (configure in Cloudflare Pages dashboard after first deploy)
# [[pages.projects]]
# name = "youandgee"
# custom_domains = ["youandgee.example.com"]